[project]
name = "ratchet"
version = "0.1.0"
description = "A workload-agnostic propose/measure/commit-or-rollback loop for untrusted automation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["ratchet*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
